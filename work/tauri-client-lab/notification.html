<!doctype html>
<html lang="id">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ChatX</title>
<style>
  :root{color-scheme:dark;--card:#141414;--bubble:#252525;--text:#f4f8f6;--muted:#b8b8b8;--line:#ffffff20;--accent:#1765cb}
  :root[data-theme="light"]{color-scheme:light;--card:#fff;--bubble:#f2f5f3;--text:#181d25;--muted:#686e78;--line:#121f3322}
  *{box-sizing:border-box}
  html,body,main{height:100%;margin:0;overflow:hidden}
  html{background:transparent}
  body{font:13px 'Segoe UI',Arial,sans-serif;background:transparent;color:var(--text);padding:1px}
  main{--frame-radius:18px;height:100%;display:flex;gap:12px;background:var(--card);border:1px solid var(--line);border-radius:var(--frame-radius);overflow:hidden;isolation:isolate}
  section{flex:1;min-width:0;display:grid;grid-template-rows:auto minmax(0,1fr) auto}
  header{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:12px 14px 8px}
  #kind{font-size:10px;font-weight:900;letter-spacing:.11em;color:var(--accent)}
  #kind.mention{color:#d99b18}
  h1{font-size:16px;font-weight:750;margin:4px 0 0;overflow-wrap:anywhere}
  #source{color:var(--muted);font-size:12px;margin-top:4px;overflow-wrap:anywhere}
  button,input{border:1px solid var(--line);font:inherit;border-radius:11px;background:var(--bubble);color:var(--text)}
  button{cursor:pointer;font-weight:700;padding:8px 13px}
  button:focus-visible,input:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
  main{cursor:pointer}
  #openTarget:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:4px}
  #messages{min-height:0;overflow:auto;overflow-x:hidden;overscroll-behavior:contain;padding:0 16px 8px;scrollbar-width:thin;scrollbar-color:var(--muted) transparent}
  .bubble{padding:8px 10px;margin:4px 0;border-radius:12px;background:var(--bubble);white-space:pre-wrap;overflow-wrap:anywhere}
  .bubble:last-child{background:color-mix(in srgb,var(--accent) 24%,var(--bubble))}
  .bubble img{max-width:100%;max-height:64px;object-fit:contain;display:block;margin:6px auto 0;border-radius:10px}
  footer{border-top:1px solid var(--line);padding:10px 16px 14px}
  form{display:flex;gap:7px}
  input{flex:1;min-width:0;padding:10px 11px}
  #reply{background:var(--accent);color:white}
  #error{color:#d99b18;margin:6px 0 0}
  aside{width:42%;max-width:360px;position:relative;background:#090909;overflow:hidden;
    --media-radius:calc(var(--frame-radius) - 1px);
    border-radius:var(--media-radius) 0 0 var(--media-radius);
    clip-path:inset(0 round var(--media-radius) 0 0 var(--media-radius))}
  video{display:block;width:100%;height:100%;object-fit:cover;object-position:center}
  #videoStatus{position:absolute;left:10px;bottom:10px;color:white;background:#000b;padding:6px 8px;border-radius:7px}
  #retryVideo{position:absolute;left:10px;top:10px}
  [hidden]{display:none!important}
</style>
<main>
  <aside id="media" hidden>
    <video id="video" playsinline preload="auto"></video>
    <span id="videoStatus" role="status">Memuat video…</span>
    <button id="retryVideo" type="button" hidden>Coba putar video</button>
  </aside>
  <section>
    <header><div id="openTarget" role="button" tabindex="0" aria-label="Buka pesan"><div id="kind"></div><h1 id="sender"></h1><div id="source" hidden></div></div><button id="close" aria-label="Tutup notifikasi">×</button></header>
    <div id="messages"></div>
    <footer>
      <form id="quickReply"><input id="replyText" autocomplete="off" maxlength="4000" placeholder="Balas langsung…"><button id="reply">Kirim</button></form>
      <p id="error" role="status" hidden></p>
    </footer>
  </section>
</main>
<script src="rust-notification.js"></script>
</html>
