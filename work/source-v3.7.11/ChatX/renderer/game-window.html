<html><head><meta charset="utf-8"><title>ChatX Game</title><style>
*{box-sizing:border-box}html,body{margin:0;min-height:100%;font-family:"SF Pro Display","Segoe UI",sans-serif;background:#0b1419;color:#edf5f7}body{padding:16px;background:radial-gradient(circle at 20% 0,#162741 0,transparent 34%),linear-gradient(#0f1b21,#091116)}.shell{max-width:760px;margin:auto}.top{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:13px 15px;background:#17252d;border:1px solid #33464f;border-radius:18px;box-shadow:0 18px 55px #0007}.title{min-width:0}.title b{font-size:20px}.sub{font-size:12px;color:#aab8be;margin-top:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.sub.error{color:#ff8d8d}.sub.check{color:#ffd166;font-weight:800}.window-actions{display:flex;gap:8px;flex-wrap:wrap;justify-content:flex-end}.window-actions button{min-width:36px;height:36px;padding:0 10px;border:0;border-radius:11px;background:#263740;color:#eef5f7;font-size:16px}.players{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:9px;padding:12px 2px}.chip{background:#18262e;border:1px solid #34464f;border-radius:14px;padding:9px 11px;font-weight:650;display:grid;grid-template-columns:1fr auto;gap:2px 8px;align-items:center}.chip b{font-size:13px}.chip small{font-size:9px;color:#91a4ad;letter-spacing:.05em}.chip em{grid-row:1/3;grid-column:2;font-style:normal;font-size:16px}.chip.joined em{color:#439cff}.chip.pending{border-style:dashed}.chip.pending em{color:#ffd166}.chip.declined{opacity:.62}.chip.declined em{color:#ff7777}.chip.turn{outline:2px solid #439cff}.chip.checked{outline:2px solid #ffbf47;background:#3b3020}
.board-wrap{padding:4px 4px 12px;display:grid;place-items:center}.board{--cell:64px;display:grid;grid-template-columns:repeat(8,var(--cell));grid-template-rows:repeat(8,var(--cell));width:calc(var(--cell) * 8);height:calc(var(--cell) * 8);box-sizing:content-box;gap:0;border:10px solid #5b3927;border-radius:14px;overflow:hidden;box-shadow:0 8px 0 #342116,0 22px 42px #0009}.sq{appearance:none;border:0!important;border-radius:0!important;margin:0!important;padding:0!important;width:var(--cell)!important;height:var(--cell)!important;min-width:var(--cell)!important;min-height:var(--cell)!important;max-width:var(--cell)!important;max-height:var(--cell)!important;display:grid;place-items:center;cursor:pointer;position:relative;opacity:1;background-image:none!important;overflow:hidden;box-shadow:none}.sq .piece{font-size:calc(var(--cell) * .72);line-height:1;display:grid;place-items:center;width:100%;height:100%;transition:transform .1s ease;text-shadow:0 2px 1px #0004}.sq .piece.whitepiece{color:#f8edce;text-shadow:0 1px 0 #fff,0 2px 3px #2e2418}.sq .piece.blackpiece{color:#2f2219;text-shadow:0 1px 0 #a78569,0 2px 3px #0005}.sq:hover .piece{transform:scale(1.06)}.sq.light{background-color:#efd9aa!important}.sq.dark{background-color:#8b6346!important}.sq.legal:after{content:"";position:absolute;width:18%;height:18%;border-radius:50%;background:#2365c9;box-shadow:0 0 0 2px #d9ecffaa}.sq.capture:after{width:72%;height:72%;background:transparent;border:4px solid #d64b4b}.sq:disabled{cursor:default;opacity:1}.sq.sel{box-shadow:inset 0 0 0 5px #439cff,inset 0 0 24px #439cff55!important}.sq.check{box-shadow:inset 0 0 0 5px #ff4545,inset 0 0 28px #d6000066!important;animation:checkPulse .8s ease-in-out infinite alternate}.sq.checker:before{content:"";position:absolute;inset:5px;border:2px solid #ffbf47;border-radius:8px;pointer-events:none}.moving-ghost.piece{display:grid;place-items:center;line-height:1;font-size:52px;text-align:center}.moving-ghost.piece.whitepiece{color:#f8edce .ludo-shell{max-width:650px;margin:auto;padding:8px}.ludo-board{--lcell:34px;position:relative;width:calc(var(--lcell) * 15);height:calc(var(--lcell) * 15);box-sizing:content-box;margin:auto;background:#eadfc9;border:10px solid #543a2d;border-radius:18px;box-shadow:0 8px 0 #302018,0 26px 52px #0009;overflow:hidden;display:grid;grid-template-columns:repeat(15,var(--lcell));grid-template-rows:repeat(15,var(--lcell));gap:0}.lcell{background:#fffdf7;border:1px solid #c7baa4;box-shadow:none;min-width:0;min-height:0}.lcell.finish.red{background:#ef8c89}.lcell.finish.green{background:#86aeea}.lcell.finish.yellow{background:#f4d879}.lcell.finish.blue{background:#8bc7f5}.home{margin:7%;border-radius:16%;box-shadow:inset 0 0 0 7px #ffffffaa,0 5px 15px #0003;display:grid;grid-template-columns:1fr 1fr;grid-template-rows:1fr 1fr;gap:12%;padding:18%;z-index:2}.home.red{background:#ef5350}.home.green{background:#427dd6}.home.yellow{background:#f4c542}.home.blue{background:#42a5f5}.center{z-index:2;background:conic-gradient(#ef5350 0 25%,#427dd6 0 50%,#f4c542 0 75%,#42a5f5 0);clip-path:polygon(50% 0,100% 50%,50% 100%,0 50%)}.pawn{position:relative;border:2px solid #fff9;border-radius:50%;box-shadow:inset 0 -5px #0003,inset 0 4px #fff8,0 5px 7px #0005;cursor:pointer;z-index:5;padding:8%;width:calc(var(--lcell) * 1.05);height:calc(var(--lcell) * 1.05);min-width:24px;min-height:24px;max-width:42px;max-height:42px;align-self:center;justify-self:center}.pawn span{display:block;width:48%;height:48%;margin:auto;border-radius:50%;background:#fff8;box-shadow:inset 0 2px #fff}.pawn.red{background:#ef5350}.pawn.green{background:#427dd6}.pawn.yellow{background:#f4c542}.pawn.blue{background:#42a5f5}.pawn.on-track{width:calc(var(--lcell) * .78);height:calc(var(--lcell) * .78);min-width:20px;min-height:20px;align-self:center;justify-self:center}.home .pawn.movable{position:relative!important;z-index:50!important;pointer-events:auto!important;cursor:pointer!important}.home:has(.pawn.movable){z-ind
